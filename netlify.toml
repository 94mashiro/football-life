[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so any deep link returns index.html (the app hash-routes).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache fingerprinted assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
