<!doctype html>
<!-- The point of this file is its existence: with a root 404.html, Cloudflare
     Pages stops SPA-fallbacking unknown paths to index.html. A missing hashed
     /assets/* bundle (deploy-transition window) now fails as a clean 404
     instead of a 200 text/html that trips module MIME checks and gets edge-
     cached for a year by the _headers immutable rule. The game has exactly one
     route, so nothing legitimate ever lands here — the page itself is just a
     bounce back to / for a human who mistyped a URL. -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=/" />
    <title>页面不存在 · 绿茵轮回</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #09090b; color: #fafafa;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
      }
      p { margin: 0 0 20px; font-size: 15px; color: #9f9fa9; }
      a {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 44px; padding: 11px 22px;
        background: linear-gradient(180deg, #a855f7, #9333ea);
        color: #1a0a26; text-decoration: none;
        font-weight: 800; font-size: 14px; letter-spacing: 0.02em;
        border-radius: 12px;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.4);
      }
      a:focus-visible { outline: 2px solid #c084fc; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p>页面不存在，正在返回主页</p>
      <a href="/">回到绿茵轮回</a>
    </main>
  </body>
</html>
