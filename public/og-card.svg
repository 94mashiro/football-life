<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e0c"/>
      <stop offset="0.55" stop-color="#0f1714"/>
      <stop offset="1" stop-color="#0a0e0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#863bff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#863bff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#863bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8ff3d"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- pitch lines, subtle -->
  <g stroke="#1e2a24" stroke-width="2" fill="none" opacity="0.7">
    <rect x="60" y="60" width="1080" height="510" rx="6"/>
    <line x1="600" y1="60" x2="600" y2="570"/>
    <circle cx="600" cy="315" r="92"/>
    <rect x="60" y="220" width="120" height="190"/>
    <rect x="1020" y="220" width="120" height="190"/>
  </g>

  <!-- glowing ball mark, top-right -->
  <g transform="translate(990,150)">
    <circle r="58" fill="#863bff" opacity="0.18"/>
    <circle r="40" fill="#863bff" opacity="0.30"/>
    <circle r="22" fill="#863bff"/>
  </g>

  <!-- eyebrow -->
  <text x="100" y="148" fill="#b8ff3d" font-size="26" font-weight="700" letter-spacing="6">ROGUELIKE · 足球生涯</text>

  <!-- title -->
  <text x="96" y="280" fill="#f4fff0" font-size="104" font-weight="800" letter-spacing="-2">绿茵轮回</text>

  <!-- tagline -->
  <text x="100" y="352" fill="#c9d6cf" font-size="34" font-weight="500">从 16 岁青训踢到退役。每个决策改变命运。</text>

  <!-- feature pills -->
  <g font-size="26" font-weight="600">
    <rect x="100" y="420" width="286" height="64" rx="32" fill="#16201b" stroke="#2a3a30"/>
    <text x="243" y="460" fill="#b8ff3d" text-anchor="middle">173 个真实故事</text>

    <rect x="406" y="420" width="286" height="64" rx="32" fill="#16201b" stroke="#2a3a30"/>
    <text x="549" y="460" fill="#7dd3fc" text-anchor="middle">同种子 = 同生涯</text>

    <rect x="712" y="420" width="286" height="64" rx="32" fill="#16201b" stroke="#2a3a30"/>
    <text x="855" y="460" fill="#f0c987" text-anchor="middle">分享 · 挑战好友</text>
  </g>

  <!-- CTA -->
  <text x="100" y="556" fill="#7dd3fc" font-size="28" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, monospace">点开链接 → 直接开踢 → 你能超越我吗？</text>

  <rect x="0" y="618" width="1200" height="12" fill="url(#accent)" opacity="0.85"/>
</svg>
